<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Trabajos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e4e1d8;
  --accent:#2f5d50; --accent-soft:#e3ece8;
  --p1:#c2412d; --p2:#d98a1c; --p3:#3d7a9b; --p4:#7a8a6b;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141412;--card:#1e1e1b;--ink:#eeece6;--muted:#9c9a92;--line:#2f2e2a;--accent:#7fbfa8;--accent-soft:#22302b}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:Fraunces,serif;font-size:26px;margin:0}
h2{font-family:Fraunces,serif;font-size:20px;margin:0 0 12px}
main{max-width:820px;margin:auto;padding:8px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
label{display:block;font-weight:500;margin:10px 0 6px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.peligro{background:transparent;color:var(--p1);border:1px solid var(--p1)}
button.mini{padding:5px 10px;font-size:13px;font-weight:500;background:transparent;color:var(--muted);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.muted{color:var(--muted);font-size:13px}
.tarea{display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .1s}
.tarea:active{transform:scale(.99)}
.rank{font-family:Fraunces,serif;font-size:22px;width:30px;text-align:center;color:var(--muted)}
.tarea .info{flex:1;min-width:0}
.tarea .titulo{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lado{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
.prio{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent)}
.fase h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
.paso{display:flex;gap:10px;padding:10px;border-radius:10px;align-items:flex-start}
.paso.actual{background:var(--accent-soft)}
.paso input{width:20px;height:20px;margin-top:2px;flex:none}
.paso .cuerpo{flex:1;min-width:0}
.paso.hecho .accion{text-decoration:line-through;color:var(--muted)}
.paso .detalle{font-size:13px;color:var(--muted)}
.foco{text-align:center;padding:28px 16px}
.foco .accion{font-family:Fraunces,serif;font-size:22px;margin:10px 0}
.fuente{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fuente:last-of-type{border-bottom:0}
.fuente .nombre{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.error{color:var(--p1);margin-top:10px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes g{to{transform:rotate(360deg)}}
.hidden{display:none !important}
/* Chat de dudas */
.fondo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.hoja{background:var(--card);width:100%;max-width:820px;height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding:16px}
.hoja-cab{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.hoja-cab .t{flex:1;font-weight:600}
.msgs{flex:1;overflow-y:auto;padding:4px 0}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;word-wrap:break-word}
.msg.user{background:var(--accent);color:#fff;margin-left:15%}
.msg.assistant{background:var(--accent-soft);margin-right:8%}
.entrada{display:flex;gap:8px;padding-top:8px}
.entrada textarea{min-height:44px;height:44px;flex:1}
/* Pestañas y plan de hoy */
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;background:transparent;color:var(--muted);padding:8px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grupo h3{font-size:16px;margin:0 0 2px}
.hasta{font-size:13px;color:var(--accent);font-weight:600;margin:6px 0 4px}
.alerta{background:#fbe9e5;color:#8a2a1a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
@media (prefers-color-scheme: dark){.alerta{background:#3a1f19;color:#f2b8aa}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:20;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Mis trabajos</h1>
  <button id="btnNuevo">+ Nuevo</button>
</header>

<main>
  <!-- Formulario -->
  <section id="vistaNuevo" class="hidden">
    <div class="card">
      <h2>Añadir trabajo</h2>
      <label for="archivo">Archivo del trabajo (PDF, Word, TXT)</label>
      <input type="file" id="archivo" accept=".pdf,.docx,.txt,.md">
      <label for="texto">…o pega el enunciado</label>
      <textarea id="texto" placeholder="Opcional si subes archivo"></textarea>
      <label for="fecha">Fecha de entrega</label>
      <input type="date" id="fecha">
      <label for="fuentesForm">Fuentes de apoyo (opcional)</label>
      <input type="file" id="fuentesForm" accept=".pdf,.docx,.txt,.md" multiple>
      <div class="muted">Apuntes, lecturas, la rúbrica… La IA las usará para guiarte mejor.</div>
      <label for="notas">Notas (opcional)</label>
      <textarea id="notas" placeholder="Ej.: es en grupo, el profesor pide formato APA…"></textarea>
      <div class="row" style="margin-top:14px">
        <button class="ghost" id="btnCancelar">Cancelar</button>
        <button id="btnAnalizar">Analizar con IA</button>
      </div>
      <div id="errorForm" class="error"></div>
    </div>
  </section>

  <!-- Lista -->
  <section id="vistaLista">
    <div class="card">
      <div class="row" style="align-items:center">
        <div class="muted">Horas que puedes dedicar al día</div>
        <input type="number" id="horasDia" min="0.5" step="0.5" style="max-width:100px">
      </div>
    </div>
    <div class="tabs">
      <button id="tabHoy" class="on">📅 Hoy</button>
      <button id="tabTrabajos">📚 Trabajos</button>
    </div>
    <div id="hoy"></div>
    <div id="lista" class="hidden"></div>
  </section>

  <!-- Detalle -->
  <section id="vistaDetalle" class="hidden">
    <button class="ghost" id="btnVolver" style="margin-bottom:12px">← Volver</button>
    <div id="detalle"></div>
  </section>
</main>

<!-- Chat de dudas -->
<div id="fondoDuda" class="fondo hidden">
  <div class="hoja">
    <div class="hoja-cab">
      <div class="t" id="dudaTitulo"></div>
      <button class="mini" id="btnCerrarDuda">Cerrar</button>
    </div>
    <div class="msgs" id="dudaMsgs"></div>
    <button class="ghost" id="btnDetallar" style="margin-top:6px">🔍 Dame pasos más detallados</button>
    <div class="entrada">
      <textarea id="dudaInput" placeholder="Escribe tu duda…"></textarea>
      <button id="btnEnviarDuda">Enviar</button>
    </div>
  </div>
</div>

<input type="file" id="fuentesExtra" accept=".pdf,.docx,.txt,.md" multiple class="hidden">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = (id) => document.getElementById(id);
const CLAVE = "trabajos-v1";
const MAX_FUENTE = 20000;       // caracteres guardados por fuente
const MAX_ENUNCIADO = 30000;
let trabajos = cargar();
let horasDia = Number(localStorage.getItem("horasDia")) || 3;
$("horasDia").value = horasDia;

function cargar(){
  try {
    const t = JSON.parse(localStorage.getItem(CLAVE)) || [];
    t.forEach(x => { x.fuentes = x.fuentes || []; });
    return t;
  } catch { return []; }
}
function guardar(){
  try { localStorage.setItem(CLAVE, JSON.stringify(trabajos)); return true; }
  catch {
    aviso("No queda espacio en el navegador. Borra alguna fuente o trabajo.");
    return false;
  }
}
function aviso(txt){
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = txt;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3500);
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- Navegación ----------
function mostrar(vista){
  ["vistaNuevo","vistaLista","vistaDetalle"].forEach(v => $(v).classList.toggle("hidden", v !== vista));
  $("btnNuevo").classList.toggle("hidden", vista !== "vistaLista");
  window.scrollTo(0,0);
}
$("btnNuevo").onclick = () => { $("errorForm").textContent=""; mostrar("vistaNuevo"); };
$("btnCancelar").onclick = () => mostrar("vistaLista");
$("btnVolver").onclick = () => { pintarLista(); mostrar("vistaLista"); };
$("tabHoy").onclick = () => { pestana = "hoy"; pintarLista(); };
$("tabTrabajos").onclick = () => { pestana = "trabajos"; pintarLista(); };
$("horasDia").onchange = (e) => { horasDia = Math.max(0.5, Number(e.target.value)||3); localStorage.setItem("horasDia", horasDia); repintar(); };

// ---------- Lectura de archivos ----------
async function leerArchivo(file){
  const ext = file.name.split(".").pop().toLowerCase();
  if (ext === "pdf"){
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let txt = "";
    for (let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const c = await page.getTextContent();
      txt += c.items.map(it => it.str).join(" ") + "\n";
    }
    return txt;
  }
  if (ext === "docx"){
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value;
  }
  return await file.text();
}
async function leerFuentes(files){
  const res = [];
  for (const f of files){
    const texto = (await leerArchivo(f)).trim();
    if (texto.length < 20) { aviso(`No pude leer texto de «${f.name}»`); continue; }
    res.push({ id: crypto.randomUUID(), nombre: f.name, texto: texto.slice(0, MAX_FUENTE) });
  }
  return res;
}
const fuentesParaIA = (t) => t.fuentes.map(f => ({ nombre: f.nombre, texto: f.texto }));

// ---------- Llamadas a la IA ----------
// Llamada en directo: la IA va enviando el texto poco a poco.
// alAvanzar(textoHastaAhora, estado) se llama cada vez que llega algo nuevo.
async function llamarEnDirecto(url, datos, alAvanzar){
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) });
  if (!res.ok || !res.body){
    const bruto = await res.text().catch(() => "");
    let msg; try { msg = JSON.parse(bruto).error; } catch {}
    throw new Error(msg || `El servidor respondió con error ${res.status}. ¿Está desplegada la función?`);
  }
  const lector = res.body.getReader(), dec = new TextDecoder();
  let buffer = "", texto = "", terminado = false;
  const procesar = (linea) => {
    if (!linea.trim()) return;
    let ev; try { ev = JSON.parse(linea); } catch { return; }
    if (ev.error) throw new Error(ev.error);
    if (ev.t) { texto += ev.t; alAvanzar?.(texto, null); }
    if (ev.estado) alAvanzar?.(texto, ev.estado);
    if (ev.fin) terminado = true;
  };
  while (true){
    const { value, done } = await lector.read();
    if (done) break;
    buffer += dec.decode(value, { stream: true });
    let i;
    while ((i = buffer.indexOf("\n")) !== -1){ procesar(buffer.slice(0, i)); buffer = buffer.slice(i + 1); }
  }
  procesar(buffer);
  if (!terminado) throw new Error("Se cortó la conexión con la IA. Inténtalo de nuevo.");
  return texto;
}
function extraerJSON(texto){
  const ini = texto.indexOf("{"), fin = texto.lastIndexOf("}");
  if (ini === -1 || fin === -1) throw new Error("La IA no devolvió una respuesta válida. Inténtalo de nuevo.");
  try { return JSON.parse(texto.slice(ini, fin + 1)); }
  catch { throw new Error("La respuesta de la IA llegó incompleta. Inténtalo de nuevo."); }
}
// Analiza el trabajo mostrando el progreso en el botón.
async function analizarEnDirecto(datos, btn, textoBase){
  const texto = await llamarEnDirecto("/api/analizar", datos, (txt, estado) => {
    const pasos = (txt.match(/"accion"\s*:/g) || []).length;
    const msg = pasos ? `${textoBase}: ${pasos} paso${pasos > 1 ? "s" : ""}…` : (estado || `${textoBase}…`);
    btn.innerHTML = `<span class="spinner"></span>${esc(msg)}`;
  });
  const data = extraerJSON(texto);
  data.horasEstimadas = Math.max(0.5, Number(data.horasEstimadas) || 2);
  data.dificultad = Math.min(5, Math.max(1, Math.round(Number(data.dificultad) || 3)));
  data.fases = Array.isArray(data.fases) ? data.fases : [];
  return data;
}
function aplicarAnalisis(t, data){
  const pasos = [];
  (data.fases || []).forEach((f, fi) => (f.pasos || []).forEach(p => pasos.push({ ...p, fase: fi, hecho: false, chat: [] })));
  Object.assign(t, {
    titulo: data.titulo, asignatura: data.asignatura, resumen: data.resumen,
    horasEstimadas: data.horasEstimadas, dificultad: data.dificultad, justificacion: data.justificacion,
    fases: (data.fases || []).map(f => f.nombre), pasos, version: Date.now()
  });
}

// ---------- Nuevo trabajo ----------
$("btnAnalizar").onclick = async () => {
  const btn = $("btnAnalizar"), err = $("errorForm");
  err.textContent = "";
  const file = $("archivo").files[0];
  const fecha = $("fecha").value;
  if (!fecha) return err.textContent = "Pon la fecha de entrega.";
  if (!file && !$("texto").value.trim()) return err.textContent = "Sube un archivo o pega el enunciado.";

  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Analizando…';
  try {
    let contenido = $("texto").value.trim();
    if (file) contenido = (await leerArchivo(file)) + (contenido ? "\n\n" + contenido : "");
    if (contenido.trim().length < 20) throw new Error("No he podido leer texto del archivo (¿es un PDF escaneado?). Pega el enunciado a mano.");
    contenido = contenido.slice(0, MAX_ENUNCIADO);
    const fuentes = await leerFuentes($("fuentesForm").files);
    const notas = $("notas").value;

    const data = await analizarEnDirecto({
      contenido, fechaEntrega: fecha, nombreArchivo: file?.name, notas,
      fuentes: fuentes.map(f => ({ nombre: f.nombre, texto: f.texto }))
    }, btn, "Creando guía");

    const t = { id: crypto.randomUUID(), creado: Date.now(), fechaEntrega: fecha,
                archivo: file?.name || "Texto pegado", contenido, notas, fuentes };
    aplicarAnalisis(t, data);
    trabajos.push(t);
    if (!guardar()) { trabajos.pop(); throw new Error("No hay espacio para guardar. Prueba con menos fuentes."); }
    ["archivo","texto","fecha","notas","fuentesForm"].forEach(id => $(id).value = "");
    pintarLista(); mostrar("vistaLista");
  } catch (e){
    err.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Analizar con IA";
  }
};

// ---------- Prioridad ----------
function diasRestantes(fecha){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.round((new Date(fecha + "T00:00:00") - hoy) / 86400000);
}
function horasPendientes(t){
  const total = t.pasos.reduce((s,p) => s + (p.minutos||10), 0);
  const pend = t.pasos.filter(p => !p.hecho).reduce((s,p) => s + (p.minutos||10), 0);
  return total ? t.horasEstimadas * pend / total : t.horasEstimadas;
}
function prioridad(t){
  const dias = Math.max(diasRestantes(t.fechaEntrega), 0.5);
  const presion = horasPendientes(t) / (dias * horasDia);
  const urgencia = 10 / (dias + 1);
  const carga = t.dificultad / 5;
  return presion * 6 + urgencia * 2 + carga * 2;
}
function etiqueta(score){
  if (score >= 6) return ["Urgente","var(--p1)"];
  if (score >= 3.5) return ["Alta","var(--p2)"];
  if (score >= 1.8) return ["Media","var(--p3)"];
  return ["Baja","var(--p4)"];
}
const puntos = (n) => "●".repeat(n) + "○".repeat(5-n);
const textoDias = (d) => d < 0 ? `Vencido hace ${-d} d` : d === 0 ? "Entrega hoy" : d === 1 ? "Mañana" : `En ${d} días`;

// ---------- Borrar / completar ----------
function borrarTrabajo(id){
  trabajos = trabajos.filter(x => x.id !== id);   // se van también sus fuentes y chats
  guardar();
}
function completarTrabajo(t){
  borrarTrabajo(t.id);
  pintarLista(); mostrar("vistaLista");
  aviso("🎉 ¡Trabajo terminado! Se ha eliminado junto con sus fuentes.");
}
function marcarPaso(t, i, valor){
  t.pasos[i].hecho = valor;
  if (valor && t.pasos.every(p => p.hecho)){
    if (confirm("¿Has terminado el trabajo? Se eliminará junto con todas sus fuentes.")) return completarTrabajo(t);
    t.pasos[i].hecho = false;
  }
  guardar(); repintar();
}

// ---------- Pantalla principal (pestañas) ----------
let pestana = "hoy";
function pintarLista(){
  $("tabHoy").classList.toggle("on", pestana === "hoy");
  $("tabTrabajos").classList.toggle("on", pestana !== "hoy");
  $("hoy").classList.toggle("hidden", pestana !== "hoy");
  $("lista").classList.toggle("hidden", pestana === "hoy");
  if (pestana === "hoy") pintarHoy(); else pintarTrabajos();
}
function repintar(){
  if (!$("vistaDetalle").classList.contains("hidden")) pintarDetalle(); else pintarLista();
}

// ---------- Plan de hoy ----------
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fmt = (m) => { m = Math.round(m); const h = Math.floor(m/60), r = m % 60; return h ? `${h} h${r ? " " + r + " min" : ""}` : `${r} min`; };
// Los minutos de los pasos se escalan para que sumen las horas estimadas por la IA
function factor(t){ const total = t.pasos.reduce((s,p) => s + (p.minutos||10), 0); return total ? t.horasEstimadas*60/total : 1; }
const minPaso = (t, p) => (p.minutos||10) * factor(t);
const firma = () => trabajos.map(t => t.id + ":" + (t.version||0)).sort().join("|");

function generarPlan(){
  const presupuesto = horasDia * 60;
  const orden = trabajos.filter(t => t.pasos.some(p => !p.hecho)).sort((a,b) => prioridad(b) - prioridad(a));
  const cola = new Map(orden.map(t => [t.id, t.pasos.map((p,i) => i).filter(i => !t.pasos[i].hecho)]));
  const elegidos = new Map(orden.map(t => [t.id, []]));
  let usado = 0, necesario = 0;
  const tomar = (t) => {
    const i = cola.get(t.id)[0];
    const m = minPaso(t, t.pasos[i]);
    if (usado + m > presupuesto) return 0;
    cola.get(t.id).shift(); elegidos.get(t.id).push(i); usado += m;
    return m;
  };
  // 1) A cada trabajo, lo mínimo de hoy para llegar a tiempo (pendiente ÷ días que quedan)
  for (const t of orden){
    const pend = cola.get(t.id).reduce((s,i) => s + minPaso(t, t.pasos[i]), 0);
    const cuota = pend / Math.max(diasRestantes(t.fechaEntrega), 1);
    necesario += cuota;
    let hecho = 0;
    while (hecho < cuota && cola.get(t.id).length){ const m = tomar(t); if (!m) break; hecho += m; }
  }
  // 2) El tiempo que sobra, a los trabajos más prioritarios
  for (const t of orden){ while (cola.get(t.id).length && tomar(t)); }
  // 3) Nunca un plan vacío: al menos un paso del más prioritario
  if (!usado && orden.length){ const t = orden[0]; elegidos.get(t.id).push(cola.get(t.id).shift()); }
  return { fecha: hoyISO(), horas: horasDia, firma: firma(), necesario,
    items: orden.filter(t => elegidos.get(t.id).length).map(t => ({ tid: t.id, pasos: elegidos.get(t.id) })) };
}
function planDeHoy(forzar){
  let plan = null;
  try { plan = JSON.parse(localStorage.getItem("planHoy")); } catch {}
  if (forzar || !plan || plan.fecha !== hoyISO() || plan.horas !== horasDia || plan.firma !== firma()){
    plan = generarPlan();
    try { localStorage.setItem("planHoy", JSON.stringify(plan)); } catch {}
  }
  return plan;
}

function pintarHoy(forzar){
  if (!trabajos.length){
    $("hoy").innerHTML = `<div class="empty">No hay nada que planificar.<br>Añade un trabajo con <b>+ Nuevo</b>.</div>`;
    return;
  }
  const plan = planDeHoy(forzar);
  const presupuesto = horasDia * 60;
  const grupos = plan.items
    .map(it => { const t = trabajos.find(x => x.id === it.tid); return t && { t, pasos: it.pasos.filter(i => t.pasos[i]) }; })
    .filter(g => g && g.pasos.length);
  let total = 0, hecho = 0;
  grupos.forEach(g => g.pasos.forEach(i => { const m = minPaso(g.t, g.t.pasos[i]); total += m; if (g.t.pasos[i].hecho) hecho += m; }));

  let html = `<div class="card">
      <h2>Plan de hoy</h2>
      <div class="muted">≈ ${fmt(total)} de trabajo · tienes ${fmt(presupuesto)}</div>
      <div class="bar"><div style="width:${total ? hecho/total*100 : 0}%"></div></div>
      <div class="muted" style="margin-top:4px">${fmt(hecho)} hechos · quedan ${fmt(total - hecho)}</div>
    </div>`;

  const vencidos = trabajos.filter(t => diasRestantes(t.fechaEntrega) < 0 && t.pasos.some(p => !p.hecho));
  if (vencidos.length) html += `<div class="alerta">⚠️ Ya ha pasado la entrega de: ${vencidos.map(t => "«" + esc(t.titulo) + "»").join(", ")}. Habla con tu profesor o márcalo como terminado.</div>`;
  if (plan.necesario > presupuesto + 5) html += `<div class="alerta">⏳ Para llegar a tiempo a todas las entregas necesitarías unas <b>${fmt(plan.necesario)}</b> hoy y tienes ${fmt(presupuesto)}. Sube tus horas al día o empieza por lo de arriba.</div>`;

  if (total && hecho >= total) html += `<div class="card foco"><div class="accion">🎉 ¡Plan de hoy terminado!</div>
      <div class="muted">Puedes descansar o adelantar trabajo.</div>
      <button style="margin-top:14px" id="btnMas">Adelantar trabajo</button></div>`;

  grupos.forEach(({ t, pasos }) => {
    const [txt, color] = etiqueta(prioridad(t));
    const ultimo = t.pasos[pasos[pasos.length - 1]];
    const cumplido = pasos.every(i => t.pasos[i].hecho);
    html += `<div class="card grupo">
      <h3 data-abrir="${t.id}" style="cursor:pointer">${esc(t.titulo)} ›</h3>
      <div class="chips"><span class="prio" style="background:${color}">${txt}</span>
        <span class="chip">${textoDias(diasRestantes(t.fechaEntrega))}</span>
        <span class="chip">≈ ${fmt(pasos.reduce((s,i) => s + minPaso(t, t.pasos[i]), 0))}</span></div>
      <div class="hasta">${cumplido ? "✓ Objetivo de hoy cumplido" : `Hoy: hasta «${esc(ultimo.accion)}» (paso ${pasos[pasos.length-1] + 1} de ${t.pasos.length})`}</div>`;
    pasos.forEach(i => {
      const p = t.pasos[i];
      html += `<div class="paso ${p.hecho ? "hecho" : ""}">
          <input type="checkbox" data-t="${t.id}" data-i="${i}" ${p.hecho ? "checked" : ""} aria-label="Hecho">
          <div class="cuerpo"><div class="accion">${esc(p.accion)}</div><div class="detalle">${esc(p.detalle)} · ≈ ${fmt(minPaso(t, p))}</div></div>
          <button class="mini" data-t="${t.id}" data-duda="${i}" aria-label="Duda">❓</button>
        </div>`;
    });
    html += `</div>`;
  });
  html += `<button class="ghost" id="btnRecalcular" style="width:100%">↻ Recalcular plan</button>`;

  $("hoy").innerHTML = html;
  $("hoy").querySelectorAll("input[type=checkbox]").forEach(cb => cb.onchange = () =>
    marcarPaso(trabajos.find(x => x.id === cb.dataset.t), Number(cb.dataset.i), cb.checked));
  $("hoy").querySelectorAll("[data-duda]").forEach(b => b.onclick = () => { actualId = b.dataset.t; abrirDuda(Number(b.dataset.duda)); });
  $("hoy").querySelectorAll("[data-abrir]").forEach(h => h.onclick = () => abrir(h.dataset.abrir));
  $("btnRecalcular").onclick = () => { pintarHoy(true); aviso("Plan recalculado"); };
  if ($("btnMas")) $("btnMas").onclick = () => pintarHoy(true);
}

// ---------- Lista de trabajos ----------
function pintarTrabajos(){
  if (!trabajos.length){
    $("lista").innerHTML = `<div class="empty">Aún no tienes trabajos.<br>Pulsa <b>+ Nuevo</b> y sube el primero.</div>`;
    return;
  }
  const orden = [...trabajos].sort((a,b) => prioridad(b) - prioridad(a));
  $("lista").innerHTML = orden.map((t, i) => {
    const [txt, color] = etiqueta(prioridad(t));
    const hechos = t.pasos.filter(p => p.hecho).length;
    return `<div class="card tarea" data-id="${t.id}">
      <div class="rank">${i+1}</div>
      <div class="info">
        <div class="titulo">${esc(t.titulo)}</div>
        <div class="muted">${esc(t.asignatura)} · ${textoDias(diasRestantes(t.fechaEntrega))}</div>
        <div class="chips">
          <span class="chip">⏱ ${horasPendientes(t).toFixed(1)} h</span>
          <span class="chip">🧠 ${puntos(t.dificultad)}</span>
          ${t.fuentes.length ? `<span class="chip">📚 ${t.fuentes.length}</span>` : ""}
        </div>
        <div class="bar"><div style="width:${t.pasos.length ? hechos/t.pasos.length*100 : 0}%"></div></div>
      </div>
      <div class="lado">
        <span class="prio" style="background:${color}">${txt}</span>
        <button class="mini borrar" data-id="${t.id}" aria-label="Borrar">🗑</button>
      </div>
    </div>`;
  }).join("");
  document.querySelectorAll(".tarea").forEach(el => el.onclick = () => abrir(el.dataset.id));
  document.querySelectorAll(".borrar").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const t = trabajos.find(x => x.id === b.dataset.id);
    if (confirm(`¿Borrar «${t.titulo}» y todas sus fuentes?`)) { borrarTrabajo(t.id); pintarLista(); }
  });
}

// ---------- Detalle ----------
let actualId = null;
const actual = () => trabajos.find(x => x.id === actualId);
function abrir(id){ actualId = id; pintarDetalle(); mostrar("vistaDetalle"); }

function pintarDetalle(){
  const t = actual();
  if (!t) return;
  const idxActual = t.pasos.findIndex(p => !p.hecho);
  const sig = t.pasos[idxActual];
  const hechos = t.pasos.filter(p => p.hecho).length;

  let html = `<div class="card">
      <h2>${esc(t.titulo)}</h2>
      <div class="muted">${esc(t.asignatura)} · Entrega ${new Date(t.fechaEntrega+"T00:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</div>
      <p>${esc(t.resumen)}</p>
      <div class="chips">
        <span class="chip">⏱ ${t.horasEstimadas} h estimadas</span>
        <span class="chip">🧠 Dificultad ${t.dificultad}/5</span>
        <span class="chip">📄 ${esc(t.archivo)}</span>
      </div>
      <p class="muted">${esc(t.justificacion)}</p>
      <div class="bar"><div style="width:${t.pasos.length ? hechos/t.pasos.length*100 : 0}%"></div></div>
      <div class="muted" style="margin-top:4px">${hechos} de ${t.pasos.length} pasos</div>
    </div>`;

  if (sig) html += `<div class="card foco">
      <div class="muted">Siguiente micro acción · ${sig.minutos} min</div>
      <div class="accion">${esc(sig.accion)}</div>
      <div class="muted">${esc(sig.detalle)}</div>
      <div class="row" style="margin-top:16px">
        <button class="ghost" data-duda="${idxActual}">❓ Tengo una duda</button>
        <button id="btnHecho">✓ Hecho, siguiente</button>
      </div>
    </div>`;

  // Fuentes
  html += `<div class="card"><h2>Fuentes</h2>`;
  html += t.fuentes.length
    ? t.fuentes.map(f => `<div class="fuente"><span>📚</span><span class="nombre">${esc(f.nombre)}</span>
         <button class="mini" data-quitar="${f.id}">Quitar</button></div>`).join("")
    : `<div class="muted">Sin fuentes. Añade apuntes, lecturas o la rúbrica para que la IA te guíe mejor.</div>`;
  html += `<label for="fuentePegada">Pegar texto como fuente</label>
      <textarea id="fuentePegada" placeholder="Pega aquí apuntes, un fragmento de lectura, la rúbrica…"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="btnSubirFuente">📎 Subir archivo</button>
        <button class="ghost" id="btnPegarFuente">＋ Añadir texto</button>
      </div>
      ${t.contenido ? `<button id="btnRehacer" style="width:100%;margin-top:10px">↻ Rehacer guía usando las fuentes</button>
      <div class="muted" style="margin-top:4px">Crea una guía nueva y reinicia el progreso.</div>` : ""}
    </div>`;

  // Pasos
  html += `<div class="card">`;
  t.fases.forEach((nombre, fi) => {
    html += `<div class="fase"><h3>${esc(nombre)}</h3>`;
    t.pasos.forEach((p, pi) => {
      if (p.fase !== fi) return;
      html += `<div class="paso ${p.hecho ? "hecho" : ""} ${pi === idxActual ? "actual" : ""}">
          <input type="checkbox" data-i="${pi}" ${p.hecho ? "checked" : ""} aria-label="Hecho">
          <div class="cuerpo"><div class="accion">${esc(p.accion)}</div><div class="detalle">${esc(p.detalle)} · ${p.minutos} min</div></div>
          <button class="mini" data-duda="${pi}" aria-label="Duda">❓${p.chat?.length ? " " + Math.ceil(p.chat.length/2) : ""}</button>
        </div>`;
    });
    html += `</div>`;
  });
  html += `</div><button class="peligro" id="btnBorrar" style="width:100%">Eliminar trabajo y sus fuentes</button>`;

  $("detalle").innerHTML = html;

  if (sig) $("btnHecho").onclick = () => marcarPaso(t, idxActual, true);
  $("detalle").querySelectorAll("input[type=checkbox]").forEach(cb =>
    cb.onchange = () => marcarPaso(t, Number(cb.dataset.i), cb.checked));
  $("detalle").querySelectorAll("[data-duda]").forEach(b =>
    b.onclick = () => abrirDuda(Number(b.dataset.duda)));
  $("detalle").querySelectorAll("[data-quitar]").forEach(b => b.onclick = () => {
    t.fuentes = t.fuentes.filter(f => f.id !== b.dataset.quitar); guardar(); pintarDetalle();
  });
  $("btnSubirFuente").onclick = () => $("fuentesExtra").click();
  $("btnPegarFuente").onclick = () => {
    const txt = $("fuentePegada").value.trim();
    if (txt.length < 20) return aviso("Pega un texto un poco más largo.");
    const nombre = prompt("Nombre para esta fuente:", "Apuntes") || "Texto pegado";
    t.fuentes.push({ id: crypto.randomUUID(), nombre, texto: txt.slice(0, MAX_FUENTE) });
    if (!guardar()) t.fuentes.pop();
    pintarDetalle();
  };
  if ($("btnRehacer")) $("btnRehacer").onclick = () => rehacerGuia(t);
  $("btnBorrar").onclick = () => {
    if (!confirm("¿Eliminar este trabajo y todas sus fuentes?")) return;
    borrarTrabajo(t.id); pintarLista(); mostrar("vistaLista");
  };
}

$("fuentesExtra").onchange = async (e) => {
  const t = actual(); if (!t) return;
  const nuevas = await leerFuentes(e.target.files);
  t.fuentes.push(...nuevas);
  if (!guardar()) t.fuentes.splice(-nuevas.length, nuevas.length);
  else if (nuevas.length) aviso(`${nuevas.length} fuente(s) añadida(s)`);
  e.target.value = "";
  pintarDetalle();
};

async function rehacerGuia(t){
  if (!confirm("Se creará una guía nueva usando las fuentes y se reiniciará el progreso. ¿Continuar?")) return;
  const btn = $("btnRehacer");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Rehaciendo guía…';
  try {
    const data = await analizarEnDirecto({
      contenido: t.contenido, fechaEntrega: t.fechaEntrega, nombreArchivo: t.archivo,
      notas: t.notas, fuentes: fuentesParaIA(t)
    }, btn, "Rehaciendo guía");
    aplicarAnalisis(t, data);
    guardar(); pintarDetalle(); window.scrollTo(0,0);
    aviso("Guía actualizada con tus fuentes");
  } catch (e){
    aviso(e.message);
    btn.disabled = false; btn.textContent = "↻ Rehacer guía usando las fuentes";
  }
}

// ---------- Chat de dudas ----------
let dudaIdx = null;
function abrirDuda(i){
  dudaIdx = i;
  const p = actual().pasos[i];
  p.chat = p.chat || [];
  $("dudaTitulo").textContent = p.accion;
  pintarChat();
  $("fondoDuda").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function cerrarDuda(){
  $("fondoDuda").classList.add("hidden");
  document.body.style.overflow = "";
  repintar();
}
function pintarChat(cargando, parcial){
  const p = actual().pasos[dudaIdx];
  let html = p.chat.length ? "" : `<div class="muted" style="padding:8px 0">${esc(p.detalle)}<br><br>Pregunta lo que quieras sobre este paso o pulsa «Dame pasos más detallados».</div>`;
  html += p.chat.map(m => `<div class="msg ${m.role}">${esc(m.content)}</div>`).join("");
  if (parcial) html += `<div class="msg assistant">${esc(parcial)}</div>`;
  else if (cargando) html += `<div class="msg assistant"><span class="spinner"></span>Pensando…</div>`;
  $("dudaMsgs").innerHTML = html;
  $("dudaMsgs").scrollTop = $("dudaMsgs").scrollHeight;
}
async function enviarDuda(pregunta){
  pregunta = pregunta.trim();
  if (!pregunta) return;
  const t = actual(), p = t.pasos[dudaIdx];
  const historial = p.chat.slice();
  p.chat.push({ role: "user", content: pregunta });
  $("dudaInput").value = "";
  $("btnEnviarDuda").disabled = $("btnDetallar").disabled = true;
  pintarChat(true);
  try {
    const respuesta = await llamarEnDirecto("/api/duda", {
      trabajo: { titulo: t.titulo, asignatura: t.asignatura, resumen: t.resumen },
      paso: { accion: p.accion, detalle: p.detalle },
      fuentes: fuentesParaIA(t), historial, pregunta
    }, (txt) => { if (txt) pintarChat(true, txt); });
    p.chat.push({ role: "assistant", content: respuesta.trim() });
    guardar();
  } catch (e){
    p.chat.pop();
    $("dudaInput").value = pregunta;
    aviso(e.message);
  } finally {
    $("btnEnviarDuda").disabled = $("btnDetallar").disabled = false;
    pintarChat();
  }
}
$("btnCerrarDuda").onclick = cerrarDuda;
$("fondoDuda").onclick = (e) => { if (e.target === $("fondoDuda")) cerrarDuda(); };
$("btnEnviarDuda").onclick = () => enviarDuda($("dudaInput").value);
$("btnDetallar").onclick = () => enviarDuda("Explícame este paso dividido en sub-pasos más pequeños y detallados.");

pintarLista();
</script>
